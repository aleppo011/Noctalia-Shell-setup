config_version = 13

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    center = [ "workspaces" ]
    color = "primary"
    concave_edge_corners = false
    end = [ "control-center", "network", "bluetooth", "weather" ]
    font_family = "Google Sans"
    font_weight = 700
    margin_edge = 10
    margin_ends = 10
    padding = 4
    position = "left"
    radius = 10
    scale = 1.2000000104308128
    shadow = false
    start = [ "session", "clock", "battery", "launcher" ]

[desktop_widgets]
